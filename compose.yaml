name: hring

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hring
      POSTGRES_USER: hring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - hring_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hring -d hring"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [hring_internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - hring_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    networks: [hring_internal]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hring}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - hring_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [hring_internal]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hring}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    entrypoint: >-
      /bin/sh -c '
      mc alias set hring http://minio:9000 "${MINIO_ROOT_USER:-hring}" "${MINIO_ROOT_PASSWORD}";
      mc mb --ignore-existing hring/hring-private;
      mc anonymous set none hring/hring-private;
      '
    restart: "no"
    networks: [hring_internal]

  ai:
    build:
      context: ./services/ai-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      INTERNAL_API_KEY: ${AI_API_KEY:?set AI_API_KEY}
      HRING_API_BASE_URL: http://api:8000/api/v1
      PROVIDER_REGISTRY_TIMEOUT_SECONDS: 5
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      PERPLEXITY_BASE_URL: ${PERPLEXITY_BASE_URL:-https://api.perplexity.ai}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [hring_internal]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      API_V1_PREFIX: /api/v1
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://hring.ir}
      DATABASE_URL: postgresql+asyncpg://hring:${POSTGRES_PASSWORD}@postgres:5432/hring
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: hring-private
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-hring}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AI_BASE_URL: http://ai:8000/v1
      AI_API_KEY: ${AI_API_KEY:?set AI_API_KEY}
      RECRUITING_AI_PROVIDER: ${RECRUITING_AI_PROVIDER:-gemini}
      RECRUITING_AI_MODEL: ${RECRUITING_AI_MODEL:-gemini-2.5-pro}
      RECRUITING_ENRICHMENT_PROVIDER: ${RECRUITING_ENRICHMENT_PROVIDER:-perplexity}
      RECRUITING_ENRICHMENT_MODEL: ${RECRUITING_ENRICHMENT_MODEL:-sonar}
      RECRUITING_SOURCING_WEBHOOK_URL: ${RECRUITING_SOURCING_WEBHOOK_URL:-}
      RECRUITING_SOURCING_WEBHOOK_BEARER_TOKEN: ${RECRUITING_SOURCING_WEBHOOK_BEARER_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://hring.ir"]}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET}
      AUTH_SECURITY_TOKEN_PEPPER: ${AUTH_SECURITY_TOKEN_PEPPER:?set AUTH_SECURITY_TOKEN_PEPPER}
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:?set AUTH_MFA_ENCRYPTION_KEY}
      AUTH_LOGIN_LOCKOUT_THRESHOLD: ${AUTH_LOGIN_LOCKOUT_THRESHOLD:-5}
      AUTH_LOGIN_LOCKOUT_MINUTES: ${AUTH_LOGIN_LOCKOUT_MINUTES:-15}
      INTEGRATION_SECRET_ENCRYPTION_KEY: ${INTEGRATION_SECRET_ENCRYPTION_KEY:?set INTEGRATION_SECRET_ENCRYPTION_KEY}
      INTEGRATION_INTERNAL_HOSTS: ${INTEGRATION_INTERNAL_HOSTS:-["ai","ollama","vllm"]}
      SMS_PROVIDER: ${SMS_PROVIDER:-disabled}
      SMS_OTP_PEPPER: ${SMS_OTP_PEPPER:?set SMS_OTP_PEPPER}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      EMAIL_RESEND_API_KEY: ${EMAIL_RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-HRing <noreply@hring.ir>}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      PAYMENT_CALLBACK_PATH: ${PAYMENT_CALLBACK_PATH:-/upgrade}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-["hring.ir","www.hring.ir","localhost","127.0.0.1","api"]}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MFA_PER_MINUTE: ${RATE_LIMIT_MFA_PER_MINUTE:-10}
    command:
      - /bin/sh
      - -ec
      - |
        alembic upgrade head
        exec uvicorn hring_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [hring_internal]

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      DATABASE_URL: postgresql+asyncpg://hring:${POSTGRES_PASSWORD}@postgres:5432/hring
      WORKER_METRICS_HOST: 0.0.0.0
      WORKER_METRICS_PORT: 9808
    command:
      - celery
      - --app=hring_api.worker.app:celery_app
      - worker
      - --loglevel=INFO
      - --hostname=hring-worker@%h
      - --queues=hring.default,hring.ai,hring.notifications,hring.maintenance
      - --concurrency=${WORKER_CONCURRENCY:-2}
      - --max-tasks-per-child=${WORKER_MAX_TASKS_PER_CHILD:-100}
      - --max-memory-per-child=${WORKER_MAX_MEMORY_PER_CHILD_KB:-262144}
      - --pidfile=
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; body = urllib.request.urlopen('http://127.0.0.1:9808/metrics', timeout=3).read(); assert b'hring_worker_ready 1.0' in body",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    mem_limit: 768m
    networks: [hring_internal]

  scheduler:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      DATABASE_URL: postgresql+asyncpg://hring:${POSTGRES_PASSWORD}@postgres:5432/hring
    command:
      - celery
      - --app=hring_api.worker.app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
      - --pidfile=/tmp/celerybeat.pid
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    networks: [hring_internal]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        # SEO output must never inherit an API/runtime URL from staging.
        PUBLIC_BASE_URL: ${PUBLIC_SITE_URL:-https://hring.ir}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [hring_internal]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./infra/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    networks: [hring_internal]

  alertmanager:
    image: prom/alertmanager:v0.34.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - hring_alertmanager:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    networks: [hring_internal]

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy
      worker:
        condition: service_healthy
      web:
        condition: service_started
      blackbox-exporter:
        condition: service_started
      alertmanager:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - hring_prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    networks: [hring_internal]

networks:
  hring_internal:
    driver: bridge

volumes:
  hring_postgres:
  hring_redis:
  hring_minio:
  hring_prometheus:
  hring_alertmanager:
