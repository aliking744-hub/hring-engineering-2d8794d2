services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.15}
    profiles: ["local-ai"]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NOHISTORY: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-32}
    volumes:
      - hring_ollama:/root/.ollama
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [hring_internal]

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.15}
    profiles: ["local-ai"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -z "$${OLLAMA_MODEL:-}" ]; then
          echo "OLLAMA_MODEL is empty; runtime is ready and no model was downloaded."
          exit 0
        fi
        ollama pull "$${OLLAMA_MODEL}"
        ollama show "$${OLLAMA_MODEL}" >/dev/null
    restart: "no"
    networks: [hring_internal]

volumes:
  hring_ollama:
