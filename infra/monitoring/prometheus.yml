global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: standalone

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: hring-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: hring-ai-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai:8000

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  - job_name: hring-http-probes
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://web/healthz
        labels:
          service: web
      - targets:
          - http://api:8000/api/v1/health
        labels:
          service: api
      - targets:
          - http://ai:8000/health
        labels:
          service: ai
      - targets:
          - http://minio:9000/minio/health/live
        labels:
          service: minio
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: hring-tcp-probes
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    static_configs:
      - targets:
          - postgres:5432
        labels:
          service: postgres
      - targets:
          - redis:6379
        labels:
          service: redis
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
