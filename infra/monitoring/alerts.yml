groups:
  - name: hring-runtime
    rules:
      - alert: HRingScrapeTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HRing scrape target is down"
          description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}."

      - alert: HRingEndpointUnavailable
        expr: probe_success{job=~"hring-http-probes|hring-tcp-probes"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HRing endpoint is unavailable"
          description: "The {{ $labels.service }} probe for {{ $labels.instance }} has failed."

      - alert: HRingHighServerErrorRatio
        expr: |
          (
            sum by (service) (rate(hring_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum by (service) (rate(hring_http_requests_total[5m])), 0.001)
          ) > 0.05
          and
          sum by (service) (rate(hring_http_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HRing server error ratio is high"
          description: "More than 5% of {{ $labels.service }} requests are returning 5xx."

      - alert: HRingHighRequestLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service) (rate(hring_http_request_duration_seconds_bucket[5m]))
          ) > 2
          and
          sum by (service) (rate(hring_http_request_duration_seconds_count[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HRing request latency is high"
          description: "The p95 latency for {{ $labels.service }} has exceeded two seconds."

      - alert: HRingProcessMemoryHigh
        expr: process_resident_memory_bytes{job=~"hring-api|hring-ai-gateway|hring-worker"} > 805306368
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HRing process memory is high"
          description: "{{ $labels.job }} is using more than 768 MiB resident memory."

      - alert: HRingWorkerHeartbeatStale
        expr: |
          hring_worker_ready == 0
          or
          time() - hring_worker_last_heartbeat_timestamp_seconds > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HRing worker heartbeat is stale"
          description: "The background worker is not ready or has stopped sending heartbeats."

      - alert: HRingPrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus configuration reload failed"
          description: "Prometheus is still running with its previous configuration."
