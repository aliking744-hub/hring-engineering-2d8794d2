name: standalone-runtime-gates

on:
  pull_request:
    branches:
      - main
      - engineering/foundation
    paths:
      - "compose*.yaml"
      - ".dockerignore"
      - ".env.standalone.example"
      - "infra/**"
      - "apps/api/**"
      - "services/ai-gateway/**"
      - "index.html"
      - "public/**"
      - "scripts/generate-sitemap.ts"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/standalone-runtime-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-standalone-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hring
          POSTGRES_USER: hring
          POSTGRES_PASSWORD: hring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hring -d hring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API checks
        run: pip install -e './apps/api[dev]'

      - name: Validate API types, migration, and native legal contracts
        working-directory: apps/api
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://hring:hring@127.0.0.1:5432/hring
          RATE_LIMIT_ENABLED: "false"
        run: |
          ruff check src tests
          mypy
          alembic upgrade head
          pytest -q tests/test_legal_domain.py

      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.standalone.example config --quiet
          docker compose \
            --env-file .env.standalone.example \
            -f compose.yaml \
            -f compose.local-ai.yaml \
            --profile local-ai \
            config --quiet
          VLLM_MODEL=Qwen/Qwen3-0.6B \
          VLLM_API_KEY=ci-only-local-key \
          docker compose \
            --env-file .env.standalone.example \
            -f compose.yaml \
            -f compose.vllm.yaml \
            --profile local-ai-vllm \
            config --quiet

      - name: Validate monitoring configuration and alert rules
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$PWD/infra/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.13.2 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --entrypoint /bin/amtool \
            --volume "$PWD/infra/monitoring:/etc/alertmanager:ro" \
            prom/alertmanager:v0.34.0 \
            check-config /etc/alertmanager/alertmanager.yml
          docker run --rm \
            --volume "$PWD/infra/monitoring:/etc/blackbox_exporter:ro" \
            prom/blackbox-exporter:v0.28.0 \
            --config.file=/etc/blackbox_exporter/blackbox.yml \
            --config.check

      - name: Build standalone web image
        run: docker build --file infra/docker/web.Dockerfile --build-arg PUBLIC_BASE_URL=https://hring.ir --tag hring-web-ci .

      - name: Build standalone API image with local OCR and pgvector client
        run: docker build --file apps/api/Dockerfile --tag hring-api-ci apps/api

      - name: Build private AI gateway image
        run: docker build --file services/ai-gateway/Dockerfile --tag hring-ai-gateway-ci services/ai-gateway
