name: standalone-runtime-gates

on:
  pull_request:
    branches:
      - main
      - engineering/foundation
    paths:
      - "compose*.yaml"
      - ".dockerignore"
      - ".env.standalone.example"
      - "infra/**"
      - "apps/api/Dockerfile"
      - "services/ai-gateway/**"
      - "index.html"
      - "public/**"
      - "scripts/generate-sitemap.ts"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/standalone-runtime-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-standalone-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.standalone.example config --quiet
          docker compose \
            --env-file .env.standalone.example \
            -f compose.yaml \
            -f compose.local-ai.yaml \
            --profile local-ai \
            config --quiet
          VLLM_MODEL=Qwen/Qwen3-0.6B \
          VLLM_API_KEY=ci-only-local-key \
          docker compose \
            --env-file .env.standalone.example \
            -f compose.yaml \
            -f compose.vllm.yaml \
            --profile local-ai-vllm \
            config --quiet

      - name: Validate monitoring configuration and alert rules
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$PWD/infra/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.13.2 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --entrypoint /bin/amtool \
            --volume "$PWD/infra/monitoring:/etc/alertmanager:ro" \
            prom/alertmanager:v0.34.0 \
            check-config /etc/alertmanager/alertmanager.yml
          docker run --rm \
            --volume "$PWD/infra/monitoring:/etc/blackbox_exporter:ro" \
            prom/blackbox-exporter:v0.28.0 \
            --config.file=/etc/blackbox_exporter/blackbox.yml \
            --config.check

      - name: Build standalone web image
        run: docker build --file infra/docker/web.Dockerfile --build-arg PUBLIC_BASE_URL=https://hring.ir --tag hring-web-ci .

      - name: Build private AI gateway image
        run: docker build --file services/ai-gateway/Dockerfile --tag hring-ai-gateway-ci services/ai-gateway
