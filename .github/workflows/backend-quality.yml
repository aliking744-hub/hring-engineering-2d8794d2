name: backend-quality-gates

on:
  push:
    branches:
      - architecture/**
      - engineering/**
      - feature/**
    paths:
      - "apps/api/**"
      - "services/ai-gateway/**"
      - "compose.yaml"
      - "infra/compose/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    branches:
      - main
      - engineering/foundation
    paths:
      - "apps/api/**"
      - "services/ai-gateway/**"
      - "compose.yaml"
      - "infra/compose/**"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://hring:hring@localhost:5432/hring
      AUTH_JWT_SECRET: ci-only-auth-secret-change-me
      OBJECT_STORAGE_SECRET_KEY: ci-only-storage-secret
      AI_API_KEY: ci-only-ai-key

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hring
          POSTGRES_USER: hring
          POSTGRES_PASSWORD: hring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hring -d hring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend with dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Migration round-trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Pytest
        run: pytest -q

      - name: Build API container
        run: docker build -t hring-api-ci .

  validate-ai-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-gateway/pyproject.toml

      - name: Install gateway with dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest -q

      - name: Build AI gateway container
        run: docker build -t hring-ai-gateway-ci .
