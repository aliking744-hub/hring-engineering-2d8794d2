name: inspect-cloudiva

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect CloudIva
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install CloudIva CLI
        run: npm install --global @cloudiva.net/cli

      - name: Authenticate and capture logs
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          diva login -t "$CHABOKAN_TOKEN"
          timeout 120s diva service logs -s hring-app || true
