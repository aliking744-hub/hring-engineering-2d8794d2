name: engineering-mirror-safety-guard

# HRing Engineering Mirror
# Production deployment is intentionally disabled in this repository.
# This workflow is a harmless manual guard/reference only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-production-deploy:
    name: MIRROR ONLY — production deploy disabled
    runs-on: ubuntu-latest
    steps:
      - name: Confirm safety boundary
        run: |
          echo "HRing Engineering is an isolated mirror."
          echo "Production CloudIva deployment is intentionally disabled."
          echo "No production service, token, or deploy command is invoked."
