name: engineering-refresh-security-lockfile

on:
  push:
    branches:
      - feature/zero-supabase-runtime
    paths:
      - ".github/workflows/refresh-security-lockfile.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/feature/zero-supabase-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout engineering branch
        uses: actions/checkout@v5
        with:
          ref: feature/zero-supabase-runtime

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Refresh vulnerable dependencies inside declared semver ranges
        run: npm audit fix --package-lock-only

      - name: Require clean production high/critical audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit lockfile only when changed and secure
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already satisfies the production security gate"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore(deps): refresh secure lockfile"
          git push origin HEAD:feature/zero-supabase-runtime
