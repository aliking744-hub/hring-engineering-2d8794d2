name: engineering-refresh-security-lockfile

on:
  pull_request:
    branches:
      - engineering/foundation
    paths:
      - ".github/workflows/refresh-security-lockfile.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/zero-supabase-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact engineering head branch
        uses: actions/checkout@v5
        with:
          ref: feature/zero-supabase-runtime

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Regenerate lockfile from declared secure dependency ranges
        run: npm install --package-lock-only --ignore-scripts

      - name: Require clean production high/critical audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit only the regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already satisfies the production security gate"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore(deps): refresh secure lockfile"
          git push origin HEAD:feature/zero-supabase-runtime
