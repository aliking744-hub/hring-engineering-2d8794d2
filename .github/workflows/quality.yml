name: engineering-quality-gates

on:
  push:
    branches:
      - engineering/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, safety tests, smoke tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Safety and smoke tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Lint baseline report (non-blocking)
        continue-on-error: true
        run: npm run lint
