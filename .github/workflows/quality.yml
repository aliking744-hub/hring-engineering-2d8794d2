name: engineering-quality-gates

on:
  push:
    branches:
      - engineering/**
      - feature/**
  pull_request:
    branches:
      - main
      - engineering/**

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, safety tests, smoke tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Scan tracked files for committed secrets
        run: node scripts/scan-secrets.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript check
        run: npm run typecheck

      - name: Safety and smoke tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Package production web artifact
        run: tar -czf hring-pr95-web-dist.tar.gz -C dist .

      - name: Upload production web artifact
        uses: actions/upload-artifact@v4
        with:
          name: hring-pr95-web-dist
          path: hring-pr95-web-dist.tar.gz
          retention-days: 3

      - name: Lint baseline report (non-blocking)
        continue-on-error: true
        run: npm run lint
